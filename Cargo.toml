[package]
name = "swipe-engine"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib -> .wasm for the browser, rlib -> native `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "EventTarget",
  "HtmlElement",
  "PointerEvent",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
