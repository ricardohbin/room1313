[package]
name = "room-1313"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib -> .wasm for the browser, rlib -> native `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "BiquadFilterNode",
  "BiquadFilterType",
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "console",
  "CssStyleDeclaration",
  "DelayNode",
  "Document",
  "DomTokenList",
  "Element",
  "EventTarget",
  "GainNode",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "OscillatorNode",
  "OscillatorType",
  "PointerEvent",
  "WaveShaperNode",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
